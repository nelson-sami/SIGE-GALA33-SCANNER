<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SIGE Gala 33</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{padding:16px}
.container{max-width:480px;margin:auto}h1{margin:10px 0 2px;text-align:center;color:#d4af37;font-size:26px}.subtitulo{text-align:center;color:#bbb;margin-bottom:18px}
.caixa,.posto{background:#1d1d1d;border:1px solid #806b20;border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}
.oculto{display:none!important}.codigo{font-size:34px;font-weight:bold;letter-spacing:5px;color:#d4af37;margin:16px 0}
#camera{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000;min-height:260px}#video{display:block;width:100%;height:340px;object-fit:cover;background:#000}
.mira{position:absolute;left:12%;top:22%;width:76%;height:56%;border:3px solid #d4af37;border-radius:14px;pointer-events:none}
.instrucao{margin:15px 0;text-align:center;color:#ddd;font-size:17px;font-weight:bold}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:9px;background:#d4af37;color:#111;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}
#estado{min-height:105px;padding:18px 14px;border-radius:12px;text-align:center;border:2px solid #555;margin-top:14px}#estadoTitulo{font-size:25px;font-weight:bold;margin-bottom:7px}#estadoTexto{font-size:16px;line-height:1.4}
.neutro{background:#222;border-color:#555!important}.verde{background:#123d24;border-color:#28a745!important}.amarelo{background:#4a3711;border-color:#ffc107!important}.vermelho{background:#481919;border-color:#dc3545!important}
#detalhes{margin-top:10px;font-size:14px;line-height:1.5}#debug{margin-top:10px;color:#888;font-size:11px;text-align:center;word-break:break-word}
</style>
</head>
<body>
<div class="container">
<h1>SIGE GALA 33</h1>
<div class="subtitulo">Leitor de Entrada</div>
<div id="telaLigacao" class="caixa"><strong>A LIGAR AO SIGE...</strong><div style="margin-top:8px;color:#bbb">Aguarde.</div></div>
<div id="telaPendente" class="caixa oculto"><strong>DISPOSITIVO A AGUARDAR AUTORIZAÇÃO</strong><div style="margin-top:10px;color:#bbb">Informe este código ao administrador:</div><div id="codigoDispositivo" class="codigo">------</div><button onclick="verificarAutorizacao()">VERIFICAR AUTORIZAÇÃO</button></div>
<div id="telaScanner" class="oculto">
<div id="posto" class="posto">Dispositivo autorizado</div>
<div id="camera"><video id="video" autoplay playsinline muted></video><div class="mira"></div></div>
<div class="instrucao">Mantenha o QR Code dentro do quadrado</div>
<button id="btnCamera" type="button" onclick="iniciarCamera()">ABRIR CÂMARA</button>
<div id="estado" class="neutro"><div id="estadoTitulo">PRONTO</div><div id="estadoTexto">Toque em ABRIR CÂMARA para iniciar.</div><div id="detalhes"></div></div>
<div id="debug"></div>
</div></div>
<iframe name="ponteSIGE" id="ponteSIGE" class="oculto"></iframe>
<form id="formSIGE" class="oculto" method="POST" target="ponteSIGE" action="https://script.google.com/macros/s/AKfycbzu5e1FsbkE2EjYmZJNB59A0OVrZKSFOBYjm_ecgi-yI-pSew5gjaalRxSXZy0HigHr/exec"><input name="acao" id="fAcao"><input name="token" id="fToken"><input name="pedidoId" id="fPedidoId"><textarea name="dadosQR" id="fDadosQR"></textarea></form>
<script>
const CHAVE_TOKEN="SIGE_GALA33_SCANNER_TOKEN";
const video=document.getElementById("video"),btnCamera=document.getElementById("btnCamera"),estado=document.getElementById("estado"),estadoTitulo=document.getElementById("estadoTitulo"),estadoTexto=document.getElementById("estadoTexto"),detalhes=document.getElementById("detalhes"),debug=document.getElementById("debug");
let token=localStorage.getItem(CHAVE_TOKEN)||"",streamActual=null,detectorQR=null,leituraActiva=false,processando=false,ultimoCodigo="",ultimaLeitura=0,pedidoPendente="",timerResposta=null,audioCtx=null;
window.addEventListener("load",()=>enviarSIGE("solicitar",""));window.addEventListener("message",receberSIGE);window.addEventListener("beforeunload",pararCamera);
function idPedido(){return Date.now()+"_"+Math.random().toString(36).slice(2,8)}
function enviarSIGE(acao,dadosQR){if(pedidoPendente)return;pedidoPendente=idPedido();document.getElementById("fAcao").value=acao;document.getElementById("fToken").value=token;document.getElementById("fPedidoId").value=pedidoPendente;document.getElementById("fDadosQR").value=dadosQR||"";document.getElementById("formSIGE").submit();clearTimeout(timerResposta);timerResposta=setTimeout(()=>{pedidoPendente="";if(acao==="validar"){processando=false;ultimoCodigo="";mostrarEstado("vermelho","SEM LIGAÇÃO","Não foi possível comunicar com o SIGE. Tente novamente.");sinalErro();setTimeout(pronto,3500)}},12000)}
function receberSIGE(ev){const r=ev.data;if(!r||r.canal!=="SIGE_GALA33")return;if(pedidoPendente&&r.pedidoId&&r.pedidoId!==pedidoPendente)return;clearTimeout(timerResposta);pedidoPendente="";if(r.acao==="solicitar"){const d=r.dispositivo||{};if(d.token){token=d.token;localStorage.setItem(CHAVE_TOKEN,token)}tratarDispositivo(d);return}if(r.acao==="verificar"){tratarAcesso(r.acesso||{});return}if(r.acao==="validar"){tratarResultado(r)}}
function tratarDispositivo(d){document.getElementById("telaLigacao").classList.add("oculto");if(d.estado==="AUTORIZADO"){abrirScanner(d.nome||"POSTO DE ENTRADA");return}document.getElementById("telaScanner").classList.add("oculto");document.getElementById("telaPendente").classList.remove("oculto");document.getElementById("codigoDispositivo").textContent=d.codigo||"------"}
function verificarAutorizacao(){if(!token){enviarSIGE("solicitar","");return}enviarSIGE("verificar","")}
function tratarAcesso(a){if(a.autorizado){abrirScanner(a.nome||"POSTO DE ENTRADA")}else{document.getElementById("telaScanner").classList.add("oculto");document.getElementById("telaPendente").classList.remove("oculto")}}
function abrirScanner(nome){document.getElementById("telaLigacao").classList.add("oculto");document.getElementById("telaPendente").classList.add("oculto");document.getElementById("telaScanner").classList.remove("oculto");document.getElementById("posto").innerHTML="<strong>"+esc(nome)+"</strong><br>Dispositivo autorizado"}
function mostrarEstado(classe,titulo,texto,extra=""){estado.className=classe;estadoTitulo.textContent=titulo;estadoTexto.textContent=texto;detalhes.innerHTML=extra}
function pronto(){processando=false;ultimoCodigo="";mostrarEstado("neutro","PRONTO","Aponte para o próximo QR Code.");debug.textContent="Câmara activa"}
async function iniciarCamera(){if(leituraActiva)return;btnCamera.disabled=true;btnCamera.textContent="A ABRIR CÂMARA...";mostrarEstado("neutro","A INICIAR","Aguarde...");try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("Este navegador não permite utilizar a câmara.");if(typeof BarcodeDetector==="undefined")throw new Error("LEITOR_QR_NAO_SUPORTADO");detectorQR=new BarcodeDetector({formats:["qr_code"]});streamActual=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:640},height:{ideal:480}}});video.srcObject=streamActual;await video.play();leituraActiva=true;btnCamera.style.display="none";activarAudio();pronto();setTimeout(procurarQRCode,500)}catch(erro){btnCamera.disabled=false;btnCamera.textContent="TENTAR NOVAMENTE";if(erro.message==="LEITOR_QR_NAO_SUPORTADO")mostrarEstado("vermelho","NAVEGADOR NÃO SUPORTADO","Este navegador não possui o leitor QR necessário.");else if(erro.name==="NotAllowedError")mostrarEstado("vermelho","CÂMARA BLOQUEADA","Autorize o acesso à câmara e tente novamente.");else mostrarEstado("vermelho","ERRO DA CÂMARA",erro.message||"Não foi possível abrir a câmara.")}}
async function procurarQRCode(){if(!leituraActiva)return;if(!processando&&detectorQR&&video.readyState>=2){try{const agora=Date.now();if(agora-ultimaLeitura>=350){ultimaLeitura=agora;const codigos=await detectorQR.detect(video);if(codigos&&codigos.length){const valor=String(codigos[0].rawValue||"").trim();if(valor&&valor!==ultimoCodigo){ultimoCodigo=valor;qrDetectado(valor)}}}}catch(e){console.log("Leitura QR:",e)}}if(leituraActiva)setTimeout(procurarQRCode,120)}
function qrDetectado(valor){processando=true;mostrarEstado("neutro","A VALIDAR","Aguarde a resposta do SIGE...");debug.textContent="";enviarSIGE("validar",valor)}
function tratarResultado(r){let extra="";if(r.nome)extra+="<strong>"+esc(r.nome)+"</strong><br>";if(r.agrupamento)extra+=esc(r.agrupamento)+"<br>";if(r.horaEntrada)extra+="Entrada: "+esc(r.horaEntrada);if(r.sucesso){mostrarEstado("verde","✓ PODE ENTRAR",r.mensagem||"Entrada autorizada.",extra);sinalSucesso();setTimeout(pronto,2200);return}if(r.tipo==="duplicado"){mostrarEstado("amarelo","⚠ JÁ ENTROU",r.mensagem||"Entrada já registada.",extra);sinalDuplicado();setTimeout(pronto,3200);return}mostrarEstado("vermelho","✕ NÃO AUTORIZADO",r.mensagem||"Entrada recusada.",extra);sinalErro();setTimeout(pronto,4500)}
function activarAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function tom(freq,dur,inicio=0){try{activarAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+inicio;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur)}catch(e){}}
function sinalSucesso(){tom(880,.13);setTimeout(()=>tom(1175,.16),130);if(navigator.vibrate)navigator.vibrate(90)}function sinalDuplicado(){tom(650,.12);setTimeout(()=>tom(650,.12),180);if(navigator.vibrate)navigator.vibrate([90,90,90])}function sinalErro(){tom(220,.35);if(navigator.vibrate)navigator.vibrate([250,100,250])}
function pararCamera(){leituraActiva=false;if(streamActual)streamActual.getTracks().forEach(t=>t.stop());streamActual=null}function esc(t){const d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}
</script>
</body>
</html>
