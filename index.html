<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>SIGE Gala 33</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 2px;
      text-align: center;
      color: #d4af37;
      font-size: 26px;
    }

    .subtitulo {
      text-align: center;
      color: #bbb;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .posto {
      background: #1d1d1d;
      border: 1px solid #806b20;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: center;
    }

    #camera {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      min-height: 260px;
    }

    #video {
      display: block;
      width: 100%;
      height: 340px;
      object-fit: cover;
      background: #000;
    }

    .mira {
      position: absolute;
      left: 12%;
      top: 22%;
      width: 76%;
      height: 56%;
      border: 3px solid #d4af37;
      border-radius: 14px;
      pointer-events: none;
    }

    .instrucao {
      margin: 15px 0;
      text-align: center;
      color: #ddd;
      font-size: 17px;
      font-weight: bold;
    }

    #estado {
      min-height: 100px;
      padding: 18px 14px;
      border-radius: 12px;
      text-align: center;
      background: #222;
      border: 2px solid #555;
      margin-top: 14px;
    }

    #estadoTitulo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    #estadoTexto {
      font-size: 16px;
      line-height: 1.4;
    }

    .neutro {
      background: #222 !important;
      border-color: #555 !important;
    }

    .verde {
      background: #123d24 !important;
      border-color: #28a745 !important;
    }

    .amarelo {
      background: #4a3711 !important;
      border-color: #ffc107 !important;
    }

    .vermelho {
      background: #481919 !important;
      border-color: #dc3545 !important;
    }

    #btnCamera {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 9px;
      background: #d4af37;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #btnCamera:disabled {
      opacity: 0.6;
    }

    #debug {
      margin-top: 12px;
      color: #999;
      font-size: 12px;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SIGE GALA 33</h1>

    <div class="subtitulo">
      Leitor de Entrada
    </div>

    <div class="posto">
      Aponte a câmara para o QR Code do convite.
    </div>

    <div id="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="mira"></div>

    </div>

    <div class="instrucao">
      Mantenha o QR Code dentro do quadrado
    </div>

    <button
      id="btnCamera"
      type="button"
      onclick="iniciarCamera()">
      ABRIR CÂMARA
    </button>

    <div
      id="estado"
      class="neutro">

      <div id="estadoTitulo">
        PRONTO
      </div>

      <div id="estadoTexto">
        Toque em ABRIR CÂMARA para iniciar.
      </div>

    </div>

    <div id="debug"></div>

  </div>


  <script>

    const video =
      document.getElementById("video");

    const btnCamera =
      document.getElementById("btnCamera");

    const estado =
      document.getElementById("estado");

    const estadoTitulo =
      document.getElementById("estadoTitulo");

    const estadoTexto =
      document.getElementById("estadoTexto");

    const debug =
      document.getElementById("debug");


    let streamActual = null;

    let detectorQR = null;

    let leituraActiva = false;

    let processando = false;

    let ultimoCodigo = "";

    let ultimaLeitura = 0;


    function mostrarEstado(
      classe,
      titulo,
      texto
    ) {

      estado.className =
        classe;

      estadoTitulo.textContent =
        titulo;

      estadoTexto.textContent =
        texto;

    }


    async function iniciarCamera() {

      if (leituraActiva) {
        return;
      }


      btnCamera.disabled = true;

      btnCamera.textContent =
        "A ABRIR CÂMARA...";


      mostrarEstado(
        "neutro",
        "A INICIAR",
        "Aguarde..."
      );


      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Este navegador não permite utilizar a câmara."
          );

        }


        if (
          typeof BarcodeDetector ===
          "undefined"
        ) {

          throw new Error(
            "LEITOR_QR_NAO_SUPORTADO"
          );

        }


        detectorQR =
          new BarcodeDetector({
            formats: ["qr_code"]
          });


        streamActual =
          await navigator.mediaDevices.getUserMedia({

            audio: false,

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 640
              },

              height: {
                ideal: 480
              }

            }

          });


        video.srcObject =
          streamActual;


        await video.play();


        leituraActiva = true;


        btnCamera.style.display =
          "none";


        mostrarEstado(
          "neutro",
          "PRONTO",
          "Aponte para o QR Code."
        );


        debug.textContent =
          "Câmara activa";


        setTimeout(
          procurarQRCode,
          500
        );

      }

      catch (erro) {

        console.error(erro);


        btnCamera.disabled = false;

        btnCamera.textContent =
          "TENTAR NOVAMENTE";


        if (
          erro &&
          erro.message ===
          "LEITOR_QR_NAO_SUPORTADO"
        ) {

          mostrarEstado(
            "vermelho",
            "NAVEGADOR NÃO SUPORTADO",
            "A câmara funciona, mas este navegador não possui o leitor QR necessário."
          );

        }

        else if (
          erro &&
          erro.name ===
          "NotAllowedError"
        ) {

          mostrarEstado(
            "vermelho",
            "CÂMARA BLOQUEADA",
            "Autorize o acesso à câmara e tente novamente."
          );

        }

        else {

          mostrarEstado(
            "vermelho",
            "ERRO DA CÂMARA",
            erro && erro.message
              ? erro.message
              : "Não foi possível abrir a câmara."
          );

        }

      }

    }


    async function procurarQRCode() {

      if (!leituraActiva) {
        return;
      }


      if (
        !processando &&
        detectorQR &&
        video.readyState >= 2
      ) {

        try {

          const agora =
            Date.now();


          /*
           * Não analisamos todos os frames.
           * Isto reduz bastante o consumo
           * de memória e processador.
           */
          if (
            agora - ultimaLeitura >=
            350
          ) {

            ultimaLeitura =
              agora;


            const codigos =
              await detectorQR.detect(
                video
              );


            if (
              codigos &&
              codigos.length > 0
            ) {

              const valor =
                String(
                  codigos[0].rawValue ||
                  ""
                ).trim();


              if (
                valor &&
                valor !== ultimoCodigo
              ) {

                ultimoCodigo =
                  valor;


                qrDetectado(
                  valor
                );

              }

            }

          }

        }

        catch (erro) {

          /*
           * Um erro ocasional de leitura
           * não encerra a câmara.
           */
          console.log(
            "Leitura QR:",
            erro
          );

        }

      }


      if (leituraActiva) {

        setTimeout(
          procurarQRCode,
          120
        );

      }

    }


    function qrDetectado(valor) {

      processando = true;


      if (
        navigator.vibrate
      ) {

        navigator.vibrate(80);

      }


      mostrarEstado(
        "verde",
        "QR LIDO",
        "Código detectado com sucesso."
      );


      debug.textContent =
        valor;


      /*
       * Nesta primeira fase apenas
       * confirmamos que a leitura funciona.
       *
       * Depois este ponto será ligado
       * ao SIGE / Google Apps Script.
       */
      setTimeout(
        function() {

          processando = false;

          ultimoCodigo = "";


          mostrarEstado(
            "neutro",
            "PRONTO",
            "Aponte para o próximo QR Code."
          );

        },
        1800
      );

    }


    function pararCamera() {

      leituraActiva = false;


      if (streamActual) {

        streamActual
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }


      streamActual = null;

    }


    window.addEventListener(
      "beforeunload",
      pararCamera
    );

  </script>

</body>
</html>
