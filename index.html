<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SIGE Gala 33</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}body{padding:16px}.container{max-width:480px;margin:auto}h1{margin:10px 0 2px;text-align:center;color:#d4af37;font-size:26px}.subtitulo{text-align:center;color:#bbb;margin-bottom:18px}.caixa,.posto{background:#1d1d1d;border:1px solid #806b20;border-radius:10px;padding:14px;margin-bottom:14px;text-align:center}.oculto{display:none!important}.codigo{font-size:34px;font-weight:bold;letter-spacing:5px;color:#d4af37;margin:16px 0}#camera{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#000;min-height:260px}#video{display:block;width:100%;height:340px;object-fit:cover;background:#000}.mira{position:absolute;left:12%;top:22%;width:76%;height:56%;border:3px solid #d4af37;border-radius:14px;pointer-events:none}.instrucao{margin:15px 0;text-align:center;color:#ddd;font-size:17px;font-weight:bold}button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:9px;background:#d4af37;color:#111;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.sair{background:#383838;color:#fff;border:1px solid #666}#estado{min-height:105px;padding:18px 14px;border-radius:12px;text-align:center;border:2px solid #555;margin-top:14px}#estadoTitulo{font-size:25px;font-weight:bold;margin-bottom:7px}#estadoTexto{font-size:16px;line-height:1.4}.neutro{background:#222;border-color:#555!important}.verde{background:#123d24;border-color:#28a745!important}.amarelo{background:#4a3711;border-color:#ffc107!important}.vermelho{background:#481919;border-color:#dc3545!important}#detalhes{margin-top:10px;font-size:14px;line-height:1.5}#debug{margin-top:10px;color:#888;font-size:11px;text-align:center;word-break:break-word}
</style>
</head>
<body>
<div class="container">
<h1>SIGE GALA 33</h1><div class="subtitulo">Leitor de Entrada</div>
<div id="telaLigacao" class="caixa"><strong>A LIGAR AO SIGE...</strong><div style="margin-top:8px;color:#bbb">Aguarde.</div></div>
<div id="telaPendente" class="caixa oculto"><strong>DISPOSITIVO A AGUARDAR AUTORIZAÇÃO</strong><div style="margin-top:10px;color:#bbb">Informe este código ao administrador:</div><div id="codigoDispositivo" class="codigo">------</div><button onclick="verificarAutorizacao()">VERIFICAR AUTORIZAÇÃO</button></div>
<div id="telaScanner" class="oculto"><div id="posto" class="posto">Dispositivo autorizado</div><div id="camera"><video id="video" autoplay playsinline muted></video><div class="mira"></div></div><div class="instrucao">Mantenha o QR Code dentro do quadrado</div><button id="btnCamera" type="button" onclick="iniciarCamera()">ABRIR CÂMARA</button><button id="btnSair" class="sair oculto" type="button" onclick="sairDoLeitor()">SAIR DO LEITOR</button><div id="estado" class="neutro"><div id="estadoTitulo">PRONTO</div><div id="estadoTexto">Toque em ABRIR CÂMARA para iniciar.</div><div id="detalhes"></div></div><div id="debug"></div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbzu5e1FsbkE2EjYmZJNB59A0OVrZKSFOBYjm_ecgi-yI-pSew5gjaalRxSXZy0HigHr/exec';
const CHAVE_TOKEN='SIGE_GALA33_SCANNER_TOKEN';
const video=document.getElementById('video'),btnCamera=document.getElementById('btnCamera'),btnSair=document.getElementById('btnSair'),estado=document.getElementById('estado'),estadoTitulo=document.getElementById('estadoTitulo'),estadoTexto=document.getElementById('estadoTexto'),detalhes=document.getElementById('detalhes'),debug=document.getElementById('debug');
let token='';try{token=localStorage.getItem(CHAVE_TOKEN)||''}catch(e){}
let streamActual=null,detectorQR=null,leituraActiva=false,processando=false,ultimoCodigo='',ultimaLeitura=0,audioCtx=null,contador=0,emLigacao=false;
window.addEventListener('load',iniciarLigacao);window.addEventListener('beforeunload',pararCamera);
function guardarToken(v){token=v||'';try{localStorage.setItem(CHAVE_TOKEN,token)}catch(e){}}
function criarToken(){try{if(crypto&&crypto.randomUUID)return crypto.randomUUID().replace(/-/g,'')}catch(e){}return 'web_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}
function chamarSIGE(acao,dadosQR,ok,falha){if(emLigacao)return;emLigacao=true;const cb='__sige_cb_'+(++contador)+'_'+Date.now();const s=document.createElement('script');let terminou=false;const limpar=()=>{if(terminou)return;terminou=true;emLigacao=false;clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}if(s.parentNode)s.parentNode.removeChild(s)};window[cb]=r=>{limpar();ok&&ok(r||{})};s.onerror=()=>{limpar();falha&&falha('Falha de ligação ao SIGE.')};const q=new URLSearchParams({api:'1',acao:acao,token:token,callback:cb,_:Date.now().toString()});if(dadosQR)q.set('dadosQR',dadosQR);s.src=API+'?'+q.toString();document.body.appendChild(s);const t=setTimeout(()=>{limpar();falha&&falha('Sem resposta do SIGE.')},10000)}
function iniciarLigacao(){if(!token){guardarToken(criarToken());chamarSIGE('solicitar','',r=>tratarSolicitar(r),erroLigacao);return}chamarSIGE('verificar','',r=>{if(r&&r.acesso&&r.acesso.motivo==='NAO_REGISTADO'){chamarSIGE('solicitar','',x=>tratarSolicitar(x),erroLigacao);return}tratarVerificar(r)},erroLigacao)}
function tratarSolicitar(r){const d=r&&r.dispositivo?r.dispositivo:null;if(!d){erroLigacao(r&&r.mensagem?r.mensagem:'Resposta inválida do SIGE.');return}if(d.token)guardarToken(d.token);document.getElementById('telaLigacao').classList.add('oculto');if(d.estado==='AUTORIZADO'){abrirScanner(d.nome||'POSTO DE ENTRADA');return}document.getElementById('telaScanner').classList.add('oculto');document.getElementById('telaPendente').classList.remove('oculto');document.getElementById('codigoDispositivo').textContent=d.codigo||'------'}
function verificarAutorizacao(){chamarSIGE('verificar','',tratarVerificar,erroLigacao)}
function tratarVerificar(r){const a=r&&r.acesso?r.acesso:null;document.getElementById('telaLigacao').classList.add('oculto');if(a&&a.autorizado){abrirScanner(a.nome||'POSTO DE ENTRADA');return}if(a&&a.motivo==='NAO_REGISTADO'){chamarSIGE('solicitar','',x=>tratarSolicitar(x),erroLigacao);return}document.getElementById('telaScanner').classList.add('oculto');document.getElementById('telaPendente').classList.remove('oculto');if(a&&a.codigo)document.getElementById('codigoDispositivo').textContent=a.codigo}
function erroLigacao(msg){document.getElementById('telaLigacao').classList.remove('oculto');document.getElementById('telaLigacao').innerHTML='<strong>SEM RESPOSTA DO SIGE</strong><div style="margin-top:8px;color:#bbb">'+esc(msg||'Verifique a Internet e actualize a página.')+'</div>'}
function abrirScanner(nome){document.getElementById('telaLigacao').classList.add('oculto');document.getElementById('telaPendente').classList.add('oculto');document.getElementById('telaScanner').classList.remove('oculto');document.getElementById('posto').innerHTML='<strong>'+esc(nome)+'</strong><br>Dispositivo autorizado'}
function mostrarEstado(classe,titulo,texto,extra=''){estado.className=classe;estadoTitulo.textContent=titulo;estadoTexto.textContent=texto;detalhes.innerHTML=extra}
function pronto(){processando=false;ultimoCodigo='';mostrarEstado('neutro','PRONTO','Aponte para o próximo QR Code.');debug.textContent='Câmara activa'}
async function iniciarCamera(){if(leituraActiva)return;btnCamera.disabled=true;btnCamera.textContent='A ABRIR CÂMARA...';mostrarEstado('neutro','A INICIAR','Aguarde...');try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Este navegador não permite utilizar a câmara.');if(typeof BarcodeDetector==='undefined')throw new Error('LEITOR_QR_NAO_SUPORTADO');detectorQR=new BarcodeDetector({formats:['qr_code']});streamActual=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}}});video.srcObject=streamActual;await video.play();leituraActiva=true;btnCamera.style.display='none';btnSair.classList.remove('oculto');activarAudio();pronto();setTimeout(procurarQRCode,400)}catch(erro){btnCamera.disabled=false;btnCamera.textContent='TENTAR NOVAMENTE';if(erro.message==='LEITOR_QR_NAO_SUPORTADO')mostrarEstado('vermelho','NAVEGADOR NÃO SUPORTADO','Use o Chrome actualizado neste telefone.');else if(erro.name==='NotAllowedError')mostrarEstado('vermelho','CÂMARA BLOQUEADA','Autorize o acesso à câmara e tente novamente.');else mostrarEstado('vermelho','ERRO DA CÂMARA',erro.message||'Não foi possível abrir a câmara.')}}
async function procurarQRCode(){if(!leituraActiva)return;if(!processando&&detectorQR&&video.readyState>=2){try{const agora=Date.now();if(agora-ultimaLeitura>=350){ultimaLeitura=agora;const codigos=await detectorQR.detect(video);if(codigos&&codigos.length){const valor=String(codigos[0].rawValue||'').trim();if(valor&&valor!==ultimoCodigo){ultimoCodigo=valor;qrDetectado(valor)}}}}catch(e){console.log(e)}}if(leituraActiva)setTimeout(procurarQRCode,120)}
function qrDetectado(valor){processando=true;mostrarEstado('neutro','A VALIDAR','Aguarde a resposta do SIGE...');debug.textContent='';chamarSIGE('validar',valor,tratarResultado,msg=>{processando=false;ultimoCodigo='';mostrarEstado('vermelho','SEM LIGAÇÃO',msg||'Não foi possível comunicar com o SIGE.');sinalErro();setTimeout(pronto,3500)})}
function tratarResultado(r){let extra='';if(r.nome)extra+='<strong>'+esc(r.nome)+'</strong><br>';if(r.agrupamento)extra+=esc(r.agrupamento)+'<br>';if(r.horaEntrada)extra+='Entrada: '+esc(r.horaEntrada);if(r.sucesso){mostrarEstado('verde','✓ PODE ENTRAR',r.mensagem||'Entrada autorizada.',extra);sinalSucesso();setTimeout(pronto,2200);return}if(r.tipo==='duplicado'){mostrarEstado('amarelo','⚠ JÁ ENTROU',r.mensagem||'Entrada já registada.',extra);sinalDuplicado();setTimeout(pronto,3200);return}mostrarEstado('vermelho','✕ NÃO AUTORIZADO',r.mensagem||'Entrada recusada.',extra);sinalErro();setTimeout(pronto,4200)}
function sairDoLeitor(){if(processando){mostrarEstado('amarelo','AGUARDE','Existe uma validação em curso.');return}pararCamera();detectorQR=null;ultimoCodigo='';ultimaLeitura=0;try{video.srcObject=null}catch(e){}btnCamera.disabled=false;btnCamera.textContent='ABRIR CÂMARA';btnCamera.style.display='block';btnSair.classList.add('oculto');mostrarEstado('neutro','CÂMARA DESLIGADA','Toque em ABRIR CÂMARA quando quiser continuar.');debug.textContent='Leitor parado'}
function activarAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tom(freq,dur,inicio=0){try{activarAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+inicio;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur)}catch(e){}}
function sinalSucesso(){tom(880,.13);setTimeout(()=>tom(1175,.16),130);if(navigator.vibrate)navigator.vibrate(90)}function sinalDuplicado(){tom(650,.12);setTimeout(()=>tom(650,.12),180);if(navigator.vibrate)navigator.vibrate([90,90,90])}function sinalErro(){tom(220,.35);if(navigator.vibrate)navigator.vibrate([250,100,250])}
function pararCamera(){leituraActiva=false;if(streamActual)streamActual.getTracks().forEach(t=>t.stop());streamActual=null}function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
</script>
</body>
</html>
